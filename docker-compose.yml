
services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: resume-matcher-backend
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      PORT: "5000"
      NODE_ENV: production
      CLIENT_URL: http://54.242.45.117
    expose:
      - "5000"
    networks:
      - resume-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: resume-matcher-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - resume-network

networks:
  resume-network:
    driver: bridge
